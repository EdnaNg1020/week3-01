<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手易 - 復古日系交換平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --retro-paper: #f4f1ea;
            --retro-red: #bc4749;
            --retro-navy: #1d3557;
            --retro-mustard: #e9c46a;
            --retro-green: #6a994e;
        }
        body {
            background-color: var(--retro-paper);
            font-family: 'Kiwi Maru', serif;
            color: var(--retro-navy);
            background-image: 
                radial-gradient(rgba(29, 53, 87, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .brush-text {
            font-family: 'Ma Shan Zheng', cursive;
        }
        .font-hand {
            font-family: 'Kiwi Maru', serif;
            font-weight: 700;
        }
        .sticker-card {
            background: white;
            border: 4px solid white;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sticker-card:hover {
            transform: translateY(-5px) rotate(-1deg);
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.05);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        #postModal {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        .input-retro {
            background: var(--retro-paper);
            border: 4px solid white;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.2s;
        }
        .input-retro:focus {
            border-color: var(--retro-mustard);
            box-shadow: 0 0 0 4px rgba(233, 196, 106, 0.2);
        }
        .btn-retro {
            padding: 0.75rem 1.5rem;
            border: 4px solid white;
            border-radius: 0.75rem;
            font-weight: 700;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }
        .btn-retro:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
        }
        .btn-primary { background-color: var(--retro-red); color: white; }
        .btn-secondary { background-color: var(--retro-navy); color: white; }
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            border: 2px solid white;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 bg-[#f4f1ea]/90 backdrop-blur-md border-b-4 border-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between py-4 gap-4">
                <div class="flex items-center gap-6 flex-1">
                    <h1 class="text-4xl cursor-pointer shrink-0 brush-text hover:scale-105 transition-transform" onclick="resetFilters()">
                        二手易
                    </h1>
                    <div class="relative flex-1 max-w-md">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input
                            id="searchInput"
                            type="text"
                            placeholder="搜尋寶物..."
                            class="w-full pl-12 pr-4 py-3 bg-white border-4 border-white rounded-xl outline-none shadow-sm font-hand"
                            oninput="handleSearch(this.value)"
                        >
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <!-- AI 摘要按鈕 -->
                    <button onclick="handleAISummary()" id="aiBtn" class="flex items-center gap-2 bg-zinc-800 text-zinc-100 px-4 py-2 rounded-full font-medium hover:bg-zinc-700 transition-colors active:scale-95 border border-zinc-700 disabled:opacity-50">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                        <span id="aiBtnText">AI 摘要</span>
                    </button>
                    <button onclick="toggleModal(true)" class="btn-retro btn-primary flex items-center gap-2">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                        <span>發佈物品</span>
                    </button>
                    <div class="relative group">
                        <div id="userProfileBtn" class="w-12 h-12 rounded-xl border-4 border-white shadow-md overflow-hidden bg-white cursor-pointer ring-2 ring-slate-100">
                            <img id="userAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Lucky" alt="Avatar" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2 pb-3 overflow-x-auto no-scrollbar" id="categoryTabs">
                <!-- JS fills -->
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
            <div class="flex flex-wrap items-center gap-3" id="statusFilters">
                <!-- JS fills -->
            </div>
            <div class="flex items-center gap-6 px-6 py-3 bg-white border-4 border-white rounded-2xl shadow-sm font-hand">
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">待售 Active</span>
                    <span id="statActive" class="text-xl font-bold">0</span>
                </div>
                <div class="w-1 h-8 bg-[#f4f1ea] rounded-full"></div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">已結 Done</span>
                    <span id="statDone" class="text-xl font-bold text-[#bc4749]">0</span>
                </div>
                <div class="w-1 h-8 bg-[#f4f1ea] rounded-full"></div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">總計 Total</span>
                    <span id="statTotal" class="text-xl font-bold">0</span>
                </div>
            </div>
        </div>

        <div id="itemList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- JS fills cards -->
        </div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center border-4 border-white shadow-md mb-6">
                <i data-lucide="package-search" class="w-10 h-10 text-slate-300"></i>
            </div>
            <h3 class="text-xl font-bold mb-2">找不到相關物品</h3>
            <p class="text-slate-500">試試更換關鍵字或分類</p>
        </div>
    </main>

    <!-- POST MODAL -->
    <div id="postModal" class="fixed inset-0 z-[100] p-4 flex items-center justify-center">
        <div class="relative sticker-card w-full max-w-2xl bg-white overflow-hidden animate-fade">
            <div class="flex items-center justify-between p-6 border-b-4 border-[#f4f1ea] bg-[#f4f1ea]/30">
                <h2 class="text-2xl font-bold brush-text">發佈新寶物 ✨</h2>
                <button onclick="toggleModal(false)" class="p-2 hover:bg-white rounded-lg transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <form id="postForm" class="p-6 max-h-[80vh] overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-lg font-bold font-hand">物品圖片 📸</label>
                        <div id="dropZone" class="relative aspect-square rounded-2xl border-4 border-dashed border-[#f4f1ea] bg-[#f4f1ea]/20 flex flex-col items-center justify-center gap-3 overflow-hidden transition-all hover:border-[#e9c46a]">
                            <img id="imagePreview" class="absolute inset-0 w-full h-full object-cover hidden" src="" alt="Preview">
                            <div id="uploadPrompt" class="text-center p-4">
                                <i data-lucide="upload" class="w-8 h-8 text-[#bc4749] mx-auto mb-2"></i>
                                <p class="text-xs font-bold font-hand">點擊上傳圖片</p>
                            </div>
                            <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">物品名稱</label>
                            <input type="text" id="title" required class="w-full input-retro font-hand" placeholder="例如：二手筆電">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">分類</label>
                            <select id="category" class="w-full input-retro font-hand">
                                <option>書籍</option>
                                <option>3C產品</option>
                                <option>生活用品</option>
                                <option>服飾</option>
                                <option>其他</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">價格/交換</label>
                            <input type="text" id="price" required class="w-full input-retro font-hand" placeholder="例如：$500">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">您的暱稱</label>
                            <input type="text" id="nickname" required class="w-full input-retro font-hand" value="小手">
                        </div>
                    </div>
                </div>
                <div class="mt-6">
                    <label class="block text-sm font-bold mb-1">物品描述</label>
                    <textarea id="description" required rows="3" class="w-full input-retro font-hand resize-none" placeholder="描述新舊程度..."></textarea>
                </div>
                <div class="mt-8 flex gap-4">
                    <button type="button" onclick="toggleModal(false)" class="flex-1 btn-retro bg-white text-slate-500">取消</button>
                    <button type="submit" class="flex-1 btn-retro btn-primary">立即發佈</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // --- GOOGLE SHEET SYNC CONFIGURATION ---
        const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbw0RnEUNsVJ9vmAdGsv_nyq811GFY0vnsSFdzvc9U3zCDa1GYAGz5QSVXmz1NkexgIA/exec";

        // --- 同步 (POST) ---
        function syncToSheet(payload) {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "PASTE_YOUR_APPS_SCRIPT_URL_HERE") {
                console.warn("syncToSheet: APPS_SCRIPT_URL 尚未設定，跳過同步");
                return;
            }
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(resp => resp.json())
            .then(data => {
                if (data.status !== "created" && data.status !== "updated" && data.status !== "deleted") {
                    console.warn("syncToSheet 回應異常:", data);
                }
            })
            .catch(err => {
                console.warn("syncToSheet 失敗 (網路或伺服器錯誤):", err);
            });
        }

        // --- 常數與狀態 ---
        const LOCAL_STORAGE_KEY = "records";
        const CATEGORIES = ["全部", "書籍", "3C產品", "生活用品", "服飾", "其他"];
        const STATUS_FILTERS = ["全部", "待售", "已出售", "收藏"];

        let currentCategory = "全部";
        let currentStatus = "全部";
        let searchQuery = "";
        let base64Image = "";

        // --- 正規化（強制所有文字欄位為字串） ---
        function normalizeRecord(record) {
            return {
                id: String(record.id || record.ID || ""),
                createdAt: String(record.createdAt || record.CreatedAt || ""),
                status: String(record.status || record.Status || "active"),
                star_status: String(record.star_status || record.Star_status || "unstarred"),
                title: String(record.title || record.Title || ""),
                description: String(record.description || record.Description || ""),
                category: String(record.category || record.Category || "其他"),
                price: String(record.price || record.Price || ""),
                nickname: String(record.nickname || record.Nickname || ""),
                imageUrl: String(record.imageUrl || record.ImageUrl || ""),
                likes: Number(record.likes !== undefined ? record.likes : (record.Likes || 0))
            };
        }

        // --- 從 Sheet 讀取 ---
        async function fetchRecordsFromSheet() {
            if (APPS_SCRIPT_URL.includes("PASTE")) return null;
            try {
                const res = await fetch(APPS_SCRIPT_URL);
                const data = await res.json();
                return Array.isArray(data.records) ? data.records.map(normalizeRecord) : null;
            } catch (e) {
                console.warn("從 Sheet 讀取失敗", e);
                return null;
            }
        }

        // --- 主要讀取（遠端優先，localStorage 備援） ---
        async function loadData() {
            const remote = await fetchRecordsFromSheet();
            if (remote) {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(remote));
                return remote;
            }
            const data = localStorage.getItem(LOCAL_STORAGE_KEY);
            try {
                const parsed = data ? JSON.parse(data) : [];
                return Array.isArray(parsed) ? parsed.map(normalizeRecord) : [];
            } catch (e) {
                return [];
            }
        }

        // --- 新增 / 儲存 ---
        async function addRecord(newRecord) {
            const records = await loadData();
            records.unshift(newRecord);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(records));
            syncToSheet({ action: "create", record: newRecord });
            await renderList(records);
        }

        async function saveData(newRecord) {
            await addRecord(newRecord);
        }

        // --- 部分更新 ---
        async function updateRecordField(id, changes) {
            const records = await loadData();
            const item = records.find(r => r.id === id);
            if (!item) return;
            Object.assign(item, changes);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(records));
            const syncChanges = { ...changes };
            delete syncChanges.imageUrl;
            syncToSheet({ action: "update", id, changes: syncChanges });
            await renderList(records);
        }

        // --- 刪除 ---
        async function deleteRecordById(id) {
            const records = await loadData();
            const filtered = records.filter(r => r.id !== id);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(filtered));
            syncToSheet({ action: "delete", id });
            await renderList(filtered);
        }

        async function deleteRecord(id, event) {
            if (event) event.preventDefault();
            if (!confirm("確定要刪除這筆寶物嗎？")) return;
            await deleteRecordById(id);
        }

        // --- 星號切換 ---
        async function toggleStar(id, event) {
            if (event) event.preventDefault();
            const records = await loadData();
            const item = records.find(r => r.id === id);
            if (!item) return;
            const newStarStatus = item.star_status === 'starred' ? 'unstarred' : 'starred';
            await updateRecordField(id, { star_status: newStarStatus });
        }

        // --- 狀態切換 ---
        async function toggleItemStatus(id, event) {
            if (event) event.preventDefault();
            const records = await loadData();
            const item = records.find(r => r.id === id);
            if (!item) return;
            const newStatus = item.status === 'active' ? 'sold' : 'active';
            await updateRecordField(id, { status: newStatus });
        }

        // --- 按讚 ---
        async function handleLike(id) {
            const records = await loadData();
            const index = records.findIndex(r => r.id === id);
            if (index !== -1) {
                records[index].likes = (records[index].likes || 0) + 1;
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(records));
                syncToSheet({ action: "update", id, changes: { likes: records[index].likes } });
                await renderList(records);
            }
        }

        // --- 渲染（支援傳入 records 避免重新 GET） ---
        async function renderList(recordsOverride) {
            const records = recordsOverride || await loadData();
            
            let filtered = records.filter(item => {
                const title = String(item.title || '');
                const desc = String(item.description || '');
                const matchesSearch = title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      desc.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = currentCategory === "全部" || item.category === currentCategory;
                
                let matchesStatus = true;
                if (currentStatus === "待售") matchesStatus = item.status === "active";
                else if (currentStatus === "已出售") matchesStatus = item.status === "sold";
                else if (currentStatus === "收藏") matchesStatus = item.star_status === "starred";

                return matchesSearch && matchesCategory && matchesStatus;
            });

            // 排序：星號優先，時間新→舊
            filtered.sort((a, b) => {
                if (a.star_status === 'starred' && b.star_status !== 'starred') return -1;
                if (a.star_status !== 'starred' && b.star_status === 'starred') return 1;
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            // 統計
            document.getElementById('statActive').innerText = records.filter(r => r.status === 'active').length;
            document.getElementById('statDone').innerText = records.filter(r => r.status === 'sold').length;
            document.getElementById('statTotal').innerText = records.length;

            const listEl = document.getElementById('itemList');
            const emptyEl = document.getElementById('emptyState');
            listEl.innerHTML = "";
            
            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
            } else {
                emptyEl.classList.add('hidden');
                filtered.forEach(item => {
                    const card = createItemCard(item);
                    listEl.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        // --- 建立卡片 ---
        function createItemCard(item) {
            const div = document.createElement('div');
            div.className = "sticker-card flex flex-col p-3 animate-fade";
            const isSold = item.status === 'sold';
            const isStarred = item.star_status === 'starred';

            div.innerHTML = `
                <div class="relative aspect-square overflow-hidden rounded-xl border-2 border-slate-50 mb-3 bg-slate-50">
                    <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1540317580384-e5d43616b9aa?q=80&w=300'}" class="w-full h-full object-cover transition-transform hover:scale-110 ${isSold ? 'grayscale opacity-70' : ''}">
                    ${isSold ? `
                        <div class="absolute inset-0 flex items-center justify-center bg-black/10">
                            <span class="px-4 py-2 bg-[#bc4749] text-white font-hand border-2 border-white rounded-lg shadow-lg rotate-[-12deg]">已出售 ✨</span>
                        </div>
                    ` : ''}
                    <div class="absolute top-2 left-2">
                        <span class="px-2 py-0.5 bg-[#e9c46a] text-[#1d3557] text-[10px] font-bold rounded shadow-sm border border-white">${item.category}</span>
                    </div>
                    <div class="absolute top-2 right-2">
                        <button onclick="toggleStar('${item.id}', event)" class="p-2 rounded-lg border-2 border-white shadow-sm transition-all ${isStarred ? 'bg-yellow-400 text-white' : 'bg-white/80 text-slate-300'}">
                            ${isStarred ? '🌟' : '⭐'}
                        </button>
                    </div>
                </div>
                <div class="px-2 pb-2">
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-bold text-[#1d3557] line-clamp-1 font-hand">${item.title}</h3>
                        <span class="text-[#bc4749] font-bold text-sm ml-2">${item.price}</span>
                    </div>
                    <p class="text-[10px] text-slate-500 line-clamp-2 h-8 overflow-hidden mb-3">${item.description}</p>
                    <div class="flex items-center justify-between pt-3 border-t-2 border-[#f4f1ea]">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded bg-slate-100 overflow-hidden border">
                                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${item.nickname}" class="w-full h-full">
                            </div>
                            <span class="text-[10px] font-bold font-hand">${item.nickname}</span>
                            <button onclick="handleLike('${item.id}')" class="ml-1 p-1 hover:text-red-500 transition-colors" title="按讚">
                                <span class="text-xs">👍 ${item.likes || 0}</span>
                            </button>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleItemStatus('${item.id}', event)" class="p-1 hover:text-green-600">
                                <i data-lucide="${isSold ? 'rotate-ccw' : 'check-circle-2'}" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteRecord('${item.id}', event)" class="p-1 hover:text-[#bc4749]">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        // --- UI 控制 ---
        function toggleModal(show) {
            const modal = document.getElementById('postModal');
            modal.style.display = show ? 'flex' : 'none';
            if (!show) {
                document.getElementById('postForm').reset();
                document.getElementById('imagePreview').classList.add('hidden');
                document.getElementById('uploadPrompt').classList.remove('hidden');
                base64Image = "";
            }
        }

        async function handleSearch(val) {
            searchQuery = val;
            await renderList();
        }

        async function setCategory(cat) {
            currentCategory = cat;
            renderCategoryTabs();          // 更新按鈕樣式
            await renderList();
        }

        async function setStatus(status) {
            currentStatus = status;
            renderStatusFilters();        // 更新按鈕樣式
            await renderList();
        }

        async function resetFilters() {
            currentCategory = "全部";
            currentStatus = "全部";
            searchQuery = "";
            document.getElementById('searchInput').value = "";
            renderCategoryTabs();
            renderStatusFilters();
            await renderList();
        }

        function renderCategoryTabs() {
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = CATEGORIES.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all border-4 border-white font-hand ${currentCategory === cat ? 'bg-[#1d3557] text-white' : 'bg-white text-[#1d3557] hover:bg-white'}">
                    ${cat}
                </button>
            `).join('');
        }

        function renderStatusFilters() {
            const filters = document.getElementById('statusFilters');
            filters.innerHTML = STATUS_FILTERS.map(status => `
                <button onclick="setStatus('${status}')" class="px-5 py-2 rounded-xl text-sm font-bold transition-all border-4 border-white font-hand shadow-sm ${currentStatus === status ? 'bg-[#bc4749] text-white' : 'bg-white text-[#1d3557]'}">
                    ${status === '全部' ? '全部狀態' : status}
                </button>
            `).join('');
        }

        // --- 圖片上傳 ---
        document.getElementById('fileInput').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(re) {
                    base64Image = re.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.src = base64Image;
                    preview.classList.remove('hidden');
                    document.getElementById('uploadPrompt').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        // --- 表單提交 ---
        document.getElementById('postForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const price = document.getElementById('price').value.trim();
            const description = document.getElementById('description').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const category = document.getElementById('category').value;

            if (!title || !price || !description || !nickname) {
                alert("請填寫所有必填欄位（名稱、價格、描述、暱稱）");
                return;
            }

            const record = {
                id: Date.now() + "_" + Math.random().toString(36).slice(2,6),
                createdAt: new Date().toISOString(),
                status: "active",
                star_status: "unstarred",
                title, description, category, price, nickname,
                imageUrl: base64Image,
                likes: 0
            };
            
            await addRecord(record);
            toggleModal(false);
        };

        // --- AI 功能 ---
        async function askAI(userPrompt) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "askAI", prompt: userPrompt })
            });
            const data = await res.json();
            return data.result || data.error || "AI 冇回應";
        }

        async function handleAISummary() {
            const btn = document.getElementById('aiBtn');
            const text = document.getElementById('aiBtnText');
            btn.disabled = true;
            text.textContent = '思考中...';
            try {
                const records = await loadData();
                if (records.length === 0) { 
                    alert('未有物品資料可以摘要'); 
                    return; 
                }
                const summaryInput = records.slice(0, 30).map(r =>
                    `[${r.category}] ${r.title} - ${r.price}: ${r.description}`
                ).join('\n');
                const prompt = '以下是二手易嘅物品描述。請用繁體中文，用 3-5 句概括物品名稱、分類、價格區間及常見描述 patterns:\n\n' + summaryInput;
                const result = await askAI(prompt);
                alert(result);
            } catch (e) {
                alert('AI 出錯：' + e.message);
            } finally {
                btn.disabled = false;
                text.textContent = 'AI 摘要';
            }
        }

        // --- 初始化（恢復分類/狀態按鈕渲染） ---
        window.onload = async () => {
            renderCategoryTabs();
            renderStatusFilters();
            await renderList();
            lucide.createIcons();
        };
    </script>
</body>
</html>
