    <!-- JAVASCRIPT -->
    <script>
        // --- GOOGLE SHEET SYNC CONFIGURATION ---
        // ⚠️ 請務必替換為您「剛剛重新部署」產生的最新 URL
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDgz8qN3xTjLPd6PF8LsUMt4Xh3o2Us2HXxPmfcw7zmgVzl-ezpngZaGVUrFm4_cSx/exec";

        // 非同步同步函數
        function syncToSheet(payload) {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
                console.warn("syncToSheet: APPS_SCRIPT_URL 尚未設定，跳過同步");
                return;
            }
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" }, // 避開 CORS OPTIONS 預檢
                body: JSON.stringify(payload)
            })
            .then(resp => resp.json())
            .then(data => {
                if (data.status !== "created" && data.status !== "updated" && data.status !== "deleted") {
                    console.warn("syncToSheet 回應異常:", data);
                }
            })
            .catch(err => console.warn("syncToSheet 失敗:", err));
        }

        // 從 Apps Script 載入所有記錄
        async function loadFromSheet() {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) return [];
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.status === "ok" && Array.isArray(data.records)) return data.records;
                return [];
            } catch (err) {
                console.error("從 Sheet 載入失敗:", err);
                return [];
            }
        }

        // --- CONSTANTS ---
        const LOCAL_STORAGE_KEY = "records";
        const CATEGORIES = ["全部", "書籍", "3C產品", "生活用品", "服飾", "其他"];
        const STATUS_FILTERS = ["全部", "待售", "已出售", "收藏"];

        let currentCategory = "全部";
        let currentStatus = "全部";
        let searchQuery = "";
        let base64Image = "";

        // --- CORE FUNCTIONS ---
        function loadData() {
            try { return JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || "[]"); } 
            catch (e) { return []; }
        }

        function persistToLocalStorage(records) {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(records));
            renderList();
        }

        function addRecord(newRecord) {
            const records = loadData();
            records.unshift(newRecord);
            persistToLocalStorage(records);
            syncToSheet({ action: "create", record: newRecord });
        }

        function updateRecordField(id, changes) {
            const records = loadData();
            const item = records.find(r => r.id === id);
            if (!item) return;
            Object.assign(item, changes);
            persistToLocalStorage(records);
            syncToSheet({ action: "update", id: id, changes: changes });
        }

        function deleteRecordById(id) {
            const records = loadData();
            const filtered = records.filter(r => r.id !== id);
            persistToLocalStorage(filtered);
            syncToSheet({ action: "delete", id: id });
        }

        function deleteRecord(id, event) {
            if (event) event.preventDefault();
            if (!confirm("確定要刪除這筆寶物嗎？")) return;
            deleteRecordById(id);
        }

        function toggleStar(id, event) {
            if (event) event.preventDefault();
            const records = loadData();
            const item = records.find(r => r.id === id);
            if (!item) return;
            const newStarStatus = item.star_status === 'starred' ? 'unstarred' : 'starred';
            updateRecordField(id, { star_status: newStarStatus });
        }

        function toggleItemStatus(id, event) {
            if (event) event.preventDefault();
            const records = loadData();
            const item = records.find(r => r.id === id);
            if (!item) return;
            const newStatus = item.status === 'active' ? 'sold' : 'active';
            updateRecordField(id, { status: newStatus });
        }

        // --- RENDER ---
        function renderList() {
            const records = loadData();
            
            let filtered = records.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     item.description.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = currentCategory === "全部" || item.category === currentCategory;
                
                let matchesStatus = true;
                if (currentStatus === "待售") matchesStatus = item.status === "active";
                else if (currentStatus === "已出售") matchesStatus = item.status === "sold";
                else if (currentStatus === "收藏") matchesStatus = item.star_status === "starred";

                return matchesSearch && matchesCategory && matchesStatus;
            });

            filtered.sort((a, b) => {
                if (a.star_status === 'starred' && b.star_status !== 'starred') return -1;
                if (a.star_status !== 'starred' && b.star_status === 'starred') return 1;
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            const stats = {
                active: records.filter(r => r.status === 'active').length,
                sold: records.filter(r => r.status === 'sold').length,
                total: records.length
            };
            document.getElementById('statActive').innerText = stats.active;
            document.getElementById('statDone').innerText = stats.sold;
            document.getElementById('statTotal').innerText = stats.total;

            const listEl = document.getElementById('itemList');
            const emptyEl = document.getElementById('emptyState');
            
            listEl.innerHTML = "";
            
            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
            } else {
                emptyEl.classList.add('hidden');
                filtered.forEach(item => {
                    const card = createItemCard(item);
                    listEl.appendChild(card);
                });
            }

            lucide.createIcons();
        }

        function createItemCard(item) {
            const div = document.createElement('div');
            div.className = "sticker-card flex flex-col p-3 animate-fade";
            const isSold = item.status === 'sold';
            const isStarred = item.star_status === 'starred';

            div.innerHTML = `
                <div class="relative aspect-square overflow-hidden rounded-xl border-2 border-slate-50 mb-3 bg-slate-50">
                    <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1540317580384-e5d43616b9aa?q=80&w=300'}" class="w-full h-full object-cover transition-transform hover:scale-110 ${isSold ? 'grayscale opacity-70' : ''}">
                    ${isSold ? `
                        <div class="absolute inset-0 flex items-center justify-center bg-black/10">
                            <span class="px-4 py-2 bg-[#bc4749] text-white font-hand border-2 border-white rounded-lg shadow-lg rotate-[-12deg]">已出售 ✨</span>
                        </div>
                    ` : ''}
                    <div class="absolute top-2 left-2">
                        <span class="px-2 py-0.5 bg-[#e9c46a] text-[#1d3557] text-[10px] font-bold rounded shadow-sm border border-white">${item.category}</span>
                    </div>
                    <div class="absolute top-2 right-2">
                        <button onclick="toggleStar('${item.id}', event)" class="p-2 rounded-lg border-2 border-white shadow-sm transition-all ${isStarred ? 'bg-yellow-400 text-white' : 'bg-white/80 text-slate-300'}">
                            ${isStarred ? '🌟' : '⭐'}
                        </button>
                    </div>
                </div>
                <div class="px-2 pb-2">
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-bold text-[#1d3557] line-clamp-1 font-hand">${item.title}</h3>
                        <span class="text-[#bc4749] font-bold text-sm ml-2">${item.price}</span>
                    </div>
                    <p class="text-[10px] text-slate-500 line-clamp-2 h-8 overflow-hidden mb-3">${item.description}</p>
                    <div class="flex items-center justify-between pt-3 border-t-2 border-[#f4f1ea]">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded bg-slate-100 overflow-hidden border">
                                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${item.nickname}" class="w-full h-full">
                            </div>
                            <span class="text-[10px] font-bold font-hand">${item.nickname}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleItemStatus('${item.id}', event)" class="p-1 hover:text-green-600">
                                <i data-lucide="${isSold ? 'rotate-ccw' : 'check-circle-2'}" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteRecord('${item.id}', event)" class="p-1 hover:text-[#bc4749]">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        // --- UI HELPERS ---
        function toggleModal(show) {
            const modal = document.getElementById('postModal');
            modal.style.display = show ? 'flex' : 'none';
            if (!show) {
                document.getElementById('postForm').reset();
                document.getElementById('imagePreview').classList.add('hidden');
                document.getElementById('uploadPrompt').classList.remove('hidden');
                base64Image = "";
            }
        }

        function handleSearch(val) { searchQuery = val; renderList(); }
        function setCategory(cat) { currentCategory = cat; renderCategoryTabs(); renderList(); }
        function setStatus(status) { currentStatus = status; renderStatusFilters(); renderList(); }

        function resetFilters() {
            currentCategory = "全部";
            currentStatus = "全部";
            searchQuery = "";
            document.getElementById('searchInput').value = "";
            renderCategoryTabs();
            renderStatusFilters();
            renderList();
        }

        function renderCategoryTabs() {
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = CATEGORIES.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all border-4 border-white font-hand ${currentCategory === cat ? 'bg-[#1d3557] text-white' : 'bg-white text-[#1d3557] hover:bg-white'}">
                    ${cat}
                </button>
            `).join('');
        }

        function renderStatusFilters() {
            const filters = document.getElementById('statusFilters');
            filters.innerHTML = STATUS_FILTERS.map(status => `
                <button onclick="setStatus('${status}')" class="px-5 py-2 rounded-xl text-sm font-bold transition-all border-4 border-white font-hand shadow-sm ${currentStatus === status ? 'bg-[#bc4749] text-white' : 'bg-white text-[#1d3557]'}">
                    ${status === '全部' ? '全部狀態' : status}
                </button>
            `).join('');
        }

        // 🌟 優化：Image Handling (加入 Canvas 壓縮，防止 Base64 過大導致 GAS 寫入失敗)
        document.getElementById('fileInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(re) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800; // 限制最大邊長為 800px
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    } else if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // 轉為 JPEG 並設定品質為 0.7，大幅減少字串長度
                    base64Image = canvas.toDataURL('image/jpeg', 0.7); 
                    
                    const preview = document.getElementById('imagePreview');
                    preview.src = base64Image;
                    preview.classList.remove('hidden');
                    document.getElementById('uploadPrompt').classList.add('hidden');
                };
                img.src = re.target.result;
            };
            reader.readAsDataURL(file);
        };

        // Form Submit
        document.getElementById('postForm').onsubmit = function(e) {
            e.preventDefault();
            const record = {
                id: Date.now() + "_" + Math.random().toString(36).slice(2,6),
                createdAt: new Date().toISOString(),
                status: "active",
                star_status: "unstarred",
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                nickname: document.getElementById('nickname').value,
                imageUrl: base64Image || "https://images.unsplash.com/photo-1540317580384-e5d43616b9aa?q=80&w=300"
            };
            addRecord(record);
            toggleModal(false);
        };

        // --- 合併雲端與本地資料 ---
        function mergeRecords(localRecords, sheetRecords) {
            const map = new Map();
            localRecords.forEach(r => map.set(r.id, r));
            sheetRecords.forEach(r => {
                const existing = map.get(r.id);
                if (!existing || new Date(r.createdAt) > new Date(existing.createdAt)) {
                    map.set(r.id, r);
                }
            });
            return Array.from(map.values()).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }

        // --- 初始化 ---
        window.onload = async () => {
            const sheetRecords = await loadFromSheet();
            const localRecords = loadData();
            const merged = mergeRecords(localRecords, sheetRecords);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(merged));
            
            renderCategoryTabs();
            renderStatusFilters();
            renderList();
            lucide.createIcons();
        };
    </script>
